function craftView(){return gameHeader('临时营地',true)+`<div class="craft-body"><aside class="panel recipe-list"><div class="eyebrow">营地 · 全部配方</div><h2>加工与制作</h2>${[['烧水','15分钟 · 需金属锅'],['烹饪块根','30分钟 · 需金属锅'],['石刀','30分钟'],['简易斧','60分钟'],['草药绷带','15分钟'],['建遮蔽棚','120分钟'],['铺床垫','60分钟 · 需遮蔽棚']].map((a,i)=>`<div class="recipe ${i===0?'current':''}">${a[0]}<small>${a[1]}</small></div>`).join('')}</aside><section class="panel craft-main"><div class="eyebrow">主行动 · 已暂停</div><h1>烧水</h1><div class="pause-banner">△ 火堆已熄灭，加工暂停。<br>原材料与已完成工作量保留，补充燃料并点火后可继续。</div><div class="recipe-flow">${item(['dirty_water','脏水',2,'已预留 · 当前地面'])}<span class="arrow">→</span>${item(['clean_water','净水',2,'完成后放在营地地面'])}</div><div class="reserved">✓ 金属锅在随身物品中，不被消耗。<br>◉ 两份脏水已预留，暂不能用于其他操作。</div><div class="progress-wrap"><div style="display:flex;justify-content:space-between"><span>已完成10/15工作分钟</span><b>剩余5工作分钟</b></div><div class="track"><i style="width:66.67%"></i></div><div class="small muted">点火耗时会额外推进世界时间，不计入原加工进度。</div></div><div style="display:flex;gap:12px;margin-top:28px"><button class="primary disabled" disabled style="flex:1">继续加工 · 火堆未燃烧</button><button class="secondary" style="flex:0 0 150px">取消加工</button></div></section><aside class="panel maintenance"><div class="eyebrow">维护操作</div><h2>火堆</h2><div class="fire-art" style="opacity:.4">${icon('fire')}</div><dl><dt>状态</dt><dd style="color:#e5bc86">未点燃</dd><dt>剩余燃料</dt><dd>0分钟 / 上限240</dd><dt>可用木材</dt><dd>10份（随身8）</dd><dt>点火工具</dt><dd>打火器 · 随身</dd></dl><div class="step"><b>1 投入1份木材</b>燃料 +60分钟 · 不耗时<br><button class="secondary" style="margin-top:10px;width:100%">投入木材</button></div><div class="step"><b>2 点火</b>耗时5分钟，燃料也会消耗5分钟。<br><button class="secondary disabled" disabled style="margin-top:10px;width:100%">点火 · 需先有燃料</button></div><div class="small muted" style="line-height:1.8">维护完成后，仍由你确认继续加工。取消将返还预留材料至营地地面。</div></aside></div>`+footer('主行动暂停 · 世界时间仅在执行维护或其他允许的子行动时推进。')}

const views={a:viewA,b:viewB,c:viewC,map:mapView,craft:craftView,pause:pauseView};
function fit(){const host=document.getElementById('viewport'),screen=document.getElementById('screen');const scale=Math.min(1,host.clientWidth/1600);screen.style.transform=`scale(${scale})`;host.style.height=900*scale+'px'}
function select(view){if(!views[view])view='a';const screen=document.getElementById('screen');screen.className='screen '+(view==='b'?'b':view==='c'?'c':'a');screen.dataset.view=view;screen.innerHTML=views[view]();if(view==='pause'){screen.querySelectorAll('.vital')[2].querySelector('b').innerHTML='19<small> /100</small>';screen.querySelectorAll('.vital')[2].querySelector('i').style.width='19%';screen.querySelector('.op-head .eyebrow').textContent='主行动 · 已暂停';screen.querySelector('.op-head p').textContent='处理补给后可继续原行动';const facts=screen.querySelectorAll('.op-facts .fact');facts[0].querySelector('span').textContent='剩余工作量';facts[0].querySelector('strong').textContent='10分钟';facts[1].querySelector('span').textContent='当前状态';facts[1].querySelector('strong').textContent='已暂停';facts[2].querySelector('span').textContent='待完成产出';facts[3].querySelector('span').textContent='库存预留';facts[3].querySelector('strong').textContent='2份';screen.querySelector('.resource.selected .sub').textContent='2份已预留 · 主行动暂停';screen.querySelectorAll('.estimate b')[0].textContent='补给后重算';screen.querySelectorAll('.estimate b')[1].textContent='继续前重算';const main=screen.querySelector('.operations .primary');main.textContent='采集已暂停';main.disabled=true;main.classList.add('disabled')}document.querySelectorAll('.chooser button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));fit()}
document.querySelectorAll('.chooser button').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.view}));window.addEventListener('hashchange',()=>select(location.hash.slice(1)));window.addEventListener('resize',fit);select(location.hash.slice(1)||'a');
</script></body></html>
