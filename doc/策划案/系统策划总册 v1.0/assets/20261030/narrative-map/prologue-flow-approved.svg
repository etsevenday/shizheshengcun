<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#f3f5ef"/><g font-family="Microsoft YaHei,sans-serif" fill="#243e35"><text x="50" y="65" font-size="34">新手求生序章 → 营区求医（用户答复融合）</text><text x="50" y="112" font-size="22">D5 08:00且首战胜利来客：已批准可调初值；日程教学无截止、不要求全清</text><rect x="50" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#698c75" stroke-width="2"/><text x="70" y="235" font-size="22">D1 界面/补给/首战</text><rect x="355" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#698c75" stroke-width="2"/><text x="375" y="235" font-size="22">D2 水火/净水/熟食</text><rect x="660" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#698c75" stroke-width="2"/><text x="680" y="235" font-size="22">D3 制作/负重/休息</text><rect x="965" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#698c75" stroke-width="2"/><text x="985" y="235" font-size="22">D4 村庄/诊所往返</text><rect x="1270" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#698c75" stroke-width="2"/><text x="1290" y="235" font-size="22">D5起 来客/路线</text><text x="50" y="370" font-size="29">真正的出口资格</text><text x="50" y="423" font-size="25">首战胜利（或Legacy等效）＋来客路线已知＋到访村庄</text><text x="50" y="475" font-size="23">南口 → 旧公路 → 检查哨 → 营门 → 营区；真实边和耗时保持</text><text x="50" y="532" font-size="21">融合/全部教学/村庄100%均非出区门槛；field100%发现村庄及诊所100%门槛保持</text><text x="50" y="580" font-size="21">人在外不传送，晚回营来客常驻；旧已开路不反锁、不补教学奖</text><text x="50" y="646" font-size="18">2026-10-30 已批准策划初值，未实现/未实机平衡；本图取代旧PNG中“D5未批准”的旧阶段说明</text></g></svg>